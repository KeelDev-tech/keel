name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.4.0 floor: keel.py requires Python 3.11+; a 3.10 leg can never pass.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Test operational recovery including every publication cut point
        run: python3 -m pytest -q tests/test_operational_recovery.py
      - name: Run fit-floor default regressions
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_qresolve_*.py
          tests/test_input_tray_digest_guards.py
          tests/test_legacy_rescreen_standard.py::test_cli_default_tracks_canonical_intake_floor
          tests/test_legacy_rescreen_standard.py::test_cli_min_fit_override_is_preserved
      - name: Verify offline completion cost accounting
        run: python3 -m unittest tests.test_completion_cost
      - name: Run stdlib test suite
        run: python3 -m unittest discover -s tests
      - name: Run optimization and security regressions
        run: >-
          python3 -m pytest -q
          tests/test_optimization_efficiency.py
          tests/test_optimization_pipeline.py
          tests/test_optimization_transport.py
          tests/test_optimization_legacy_gates.py
          tests/test_security_boundary_peer_denial.py
          security/tests/test_optimization_security.py
      - name: Verify matched cache benchmark
        run: PYTHONPATH=. python3 tests/benchmark_optimization_efficiency.py
      - name: Verify 10000 retained productivity cycles and replay
        run: PYTHONPATH=. python3 tests/benchmark_productivity_history.py
      - name: Honesty-gates demo smoke test
        run: KEEL_DEMO_PAUSE=0 python3 demo/honesty_gates_demo.py
