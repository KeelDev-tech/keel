name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.4.0 floor: keel.py requires Python 3.11+; a 3.10 leg can never pass.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned validation environment
        run: pip install -r requirements-validation.lock
      - name: Run offline MCP adapter safety and tool regressions
        run: python3 -m pytest -q --import-mode=importlib integrations/mcp-server/tests
      - name: Test operational safety and machine contracts
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_operational_control.py
          tests/test_operational_runtime.py
          tests/test_machine_contracts.py
          tests/test_storage_preflight.py
      # These are pytest functions; unittest discovery collects none of them.
      - name: Test evidence-based scoring contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest -q --import-mode=importlib tests/test_score_roles_evidence.py
      - name: Test operational recovery including every publication cut point
        run: python3 -m pytest -q tests/test_operational_recovery.py
      - name: Test exact packet review and decisions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: PYTHONPATH=tests:. python3 -m pytest -q --import-mode=importlib tests/test_muse_review.py tests/test_muse_dashboard.py tests/test_sources_decisions.py
      - name: Test seeded tailoring audit and grader failure detection
        run: python3 -m pytest -q tests/test_tailoring_audit.py tests/test_grounding_claims_answers.py tests/test_grounding_packet.py
      - name: Run offline seeded tailoring audit
        run: python3 -S tools/run_tailoring_audit.py --out "${RUNNER_TEMP}/keel-tailoring-audit"
      - name: Retain tailoring audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailoring-audit-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/keel-tailoring-audit/audit.json
      - name: Run fit-floor default regressions
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_qresolve_*.py
          tests/test_input_tray_digest_guards.py
          tests/test_legacy_rescreen_standard.py::test_cli_default_tracks_canonical_intake_floor
          tests/test_legacy_rescreen_standard.py::test_cli_min_fit_override_is_preserved
      - name: Verify offline completion cost accounting
        run: python3 -m unittest tests.test_completion_cost
      # unittest discovery does not execute these pytest function tests.
      - name: Test outcome safety and truthful analytics
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          KEEL_HOME: ${{ runner.temp }}/keel-outcome-tests
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_outcome_analytics_rates.py
          tests/test_outcome_attribution_regressions.py
          tests/test_outcome_integrity_submission_regressions.py
          tests/test_outcome_linkage.py
          tests/test_outcome_snapshot.py
          tests/test_record_outcome_timestamps.py
      - name: Test read-only trust evidence qualification
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest -q --import-mode=importlib tests/test_trust_evidence.py
      - name: Test offline workbench HTTP response contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_workbench_http_headers.py tests/test_workbench_integrations.py
      - name: Test exact evaluation partition audit and frozen evaluation contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python3 -m pytest -q --import-mode=importlib
          tests/test_eval_partitions.py
          tests/test_grounding_eval.py
          tests/test_reliability_lab.py
          tests/test_frontier_evaluation.py
      - name: Run stdlib test suite
        run: python3 -m unittest discover -s tests
      - name: Test conditional question supply and flow contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest -q --import-mode=importlib tests/test_flow.py
      - name: Run offline Hypothesis prescreen properties
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest -q --import-mode=importlib tests/hypothesis_prescreen_properties.py tests/test_bank_scope.py tests/test_prescreen.py tests/test_prescreen_noai_gates3733_3799.py tests/test_ready_admission.py tests/test_extended_regressions.py tests/test_legacy_rescreen_standard.py tests/test_promotion_evidence_journey.py
      - name: Run optimization and security regressions
        run: >-
          python3 -m pytest -q
          tests/test_optimization_efficiency.py
          tests/test_optimization_pipeline.py
          tests/test_optimization_transport.py
          tests/test_optimization_legacy_gates.py
          tests/test_security_boundary_peer_denial.py
          security/tests/test_optimization_security.py
      - name: Verify matched cache benchmark
        run: PYTHONPATH=. python3 tests/benchmark_optimization_efficiency.py
      - name: Verify 10000 retained productivity cycles and replay
        run: PYTHONPATH=. python3 tests/benchmark_productivity_history.py
      - name: Honesty-gates demo smoke test
        run: KEEL_DEMO_PAUSE=0 python3 demo/honesty_gates_demo.py
  workbench-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned browser verification CLI
        run: npm install --prefix "${RUNNER_TEMP}/keel-ui-tools" agent-browser@0.38.2
      - name: Verify synthetic workbench in a sandboxed browser
        run: |
          KEEL_UI_CHROME="$(command -v google-chrome || command -v chromium)"
          python tools/check_workbench_ui.py --browser "${RUNNER_TEMP}/keel-ui-tools/node_modules/.bin/agent-browser" --chrome "$KEEL_UI_CHROME" --out "${RUNNER_TEMP}/keel-ui-report"
      - name: Retain synthetic UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-ui
          path: |
            ${{ runner.temp }}/keel-ui-report/report.json
            ${{ runner.temp }}/keel-ui-report/*.png
