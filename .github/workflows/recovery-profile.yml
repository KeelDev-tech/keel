name: Recovery and clean source profile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned validation environment
        run: python -m pip install -r requirements-validation.lock
      - name: Verify recovery contracts and extracted profile
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          KEEL_HOME: ${{ runner.temp }}/keel-recovery-tests
        run: >-
          python -m pytest -q --import-mode=importlib
          tests/test_queue_transactions.py
          tests/test_task_liveness_repair.py
          tests/test_verification_transport_contract.py
          tests/test_ready_admission.py
          tests/test_staged_admission_recovery.py
          tests/test_pipeline_recovery_contract.py
          tests/test_preparation_identity_guards.py
          tests/test_verify_retry_scan_apply_port.py
          tests/test_export_adapter_v11.py
          tests/test_run_tests_profiles.py
          tests/test_release_profile.py
          tests/test_fit_policy_contract.py
          tests/test_muse_supply_recovery.py
          tests/test_supply_acceptance.py
          tests/test_supply_measurements.py
      - name: Run offline supply acceptance
        run: python -S tools/run_supply_acceptance.py --out "${RUNNER_TEMP}/keel-supply-acceptance"
      - name: Retain supply acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-acceptance-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/keel-supply-acceptance/acceptance.json
      - name: Build and verify source-only package
        run: |
          python tools/package.py --out "${RUNNER_TEMP}/keel-recovery-source.zip"
          python tools/package.py --verify "${RUNNER_TEMP}/keel-recovery-source.zip"
