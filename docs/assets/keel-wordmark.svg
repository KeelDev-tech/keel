<?xml version="1.0" encoding="UTF-8"?>
<!-- Keel wordmark. Dark navy background, front-view keel motif + "Keel" wordmark.
     Mark: symmetric hull cross-section (light) with center keel fin + waterline (accent).
     Colors: bg #0b1220, text #e8eef7, accent teal #5fb4a8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 96" width="248" height="96" role="img" aria-label="Keel">
  <rect width="248" height="96" fill="#0b1220"/>
  <g transform="translate(10,14)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- waterline -->
    <line x1="2" y1="6" x2="62" y2="6" stroke="#5fb4a8" stroke-width="3"/>
    <!-- hull cross-section -->
    <path d="M8 16 L26 44 H38 L56 16" stroke="#e8eef7" stroke-width="4.5"/>
    <!-- keel fin -->
    <line x1="32" y1="44" x2="32" y2="62" stroke="#5fb4a8" stroke-width="4.5"/>
    <circle cx="32" cy="66" r="3.5" fill="#5fb4a8" stroke="none"/>
  </g>
  <text x="92" y="66"
        font-family="'Noto Sans','Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="56" font-weight="700" letter-spacing="1"
        fill="#e8eef7">Keel</text>
</svg>
