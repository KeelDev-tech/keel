<?xml version="1.0" encoding="UTF-8"?>
<!-- Keel OG social preview, 1200x630. Dark navy, centered mark + wordmark,
     accent rule, tagline, sub-line. Colors: bg #0b1220, text #e8eef7,
     secondary #c9d5e8 / #8d9cb3, accent teal #5fb4a8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Keel — The job-application autopilot">
  <rect width="1200" height="630" fill="#0b1220"/>

  <!-- faint oversized keel watermark, right of center -->
  <g transform="translate(770,120) scale(6)" stroke="#5fb4a8" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.055">
    <line x1="2" y1="6" x2="62" y2="6"/>
    <path d="M8 16 L26 44 H38 L56 16"/>
    <line x1="32" y1="44" x2="32" y2="62"/>
    <circle cx="32" cy="66" r="3.5" fill="#5fb4a8" stroke="none"/>
  </g>

  <!-- keel mark, centered, ~2.6x -->
  <g transform="translate(507,62) scale(2.6)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="2" y1="6" x2="62" y2="6" stroke="#5fb4a8" stroke-width="3"/>
    <path d="M8 16 L26 44 H38 L56 16" stroke="#e8eef7" stroke-width="4.5"/>
    <line x1="32" y1="44" x2="32" y2="62" stroke="#5fb4a8" stroke-width="4.5"/>
    <circle cx="32" cy="66" r="3.5" fill="#5fb4a8" stroke="none"/>
  </g>

  <text x="600" y="363" text-anchor="middle"
        font-family="'Noto Sans','Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="132" font-weight="700" letter-spacing="2"
        fill="#e8eef7">Keel</text>

  <rect x="564" y="401" width="72" height="5" rx="2.5" fill="#5fb4a8"/>

  <text x="600" y="473" text-anchor="middle"
        font-family="'Noto Sans','Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="46" font-weight="500"
        fill="#c9d5e8">The job-application autopilot</text>

  <text x="600" y="535" text-anchor="middle"
        font-family="'Noto Sans','Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="30" font-weight="400" letter-spacing="1"
        fill="#8d9cb3">Open-core. Honest automation. Apache-2.0.</text>
</svg>
